# Alembic CLI config (the app migrates by itself at startup: app/db.py::migrate). The database URL comes from
# DATABASE_URL, as for the app: `alembic upgrade head`, `alembic revision --autogenerate -m "..."`.
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
