services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_factory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"  # this machine only: the database holds hashes and encrypted keys

  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Bounded runs are stepped by AGENT_FACTORY_WORKERS threads inside this service (default 1, see .env.example).
    # To scale them out, set it to 0 here and add a service running `python -m app.worker` with the same env.

  # Optional, local-only model provider (model_access "ollama") — not started by `docker compose up`;
  # run `docker compose --profile ollama up` to include it, then `docker compose exec ollama ollama pull <model>`.
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  postgres_data:
  ollama_data:
