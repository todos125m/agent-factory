<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0E17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agent Factory">
<title>Agent Factory</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><b>Agent Factory</b><span>AI Venture Team</span></div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-page="dashboard"><span class="ic" aria-hidden="true">📊</span><span data-i18n="nav.dashboard">داشبورد</span></button>
      <button class="nav-item" data-page="inbox"><span class="ic" aria-hidden="true">📥</span><span data-i18n="nav.inbox">صندوق تصمیم‌ها</span><span class="badge" id="inbox-badge" hidden>0</span></button>
      <button class="nav-item" data-page="projects"><span class="ic" aria-hidden="true">📁</span><span data-i18n="nav.projects">پروژه‌ها</span></button>
      <button class="nav-item" data-page="agents"><span class="ic" aria-hidden="true">🤖</span><span data-i18n="nav.agents">ایجنت‌ها</span></button>
      <button class="nav-item" data-page="benchmark"><span class="ic" aria-hidden="true">📈</span><span data-i18n="nav.benchmark">سنجش</span></button>
      <button class="nav-item" data-page="settings"><span class="ic" aria-hidden="true">⚙️</span><span data-i18n="nav.settings">تنظیمات</span></button>
      <button class="nav-item" data-page="observability"><span class="ic" aria-hidden="true">👁️</span><span data-i18n="nav.observability">مشاهده‌پذیری</span></button>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1>Agent Factory</h1>
      <div class="spacer"></div>
      <select id="lang-picker" class="lang-picker" aria-label="Language / زبان / Dil"></select>
      <span class="pill" data-i18n="app.subtitle">کارخانه‌ی ایجنت</span>
    </header>
    <div id="notice" class="notice" role="status" hidden></div>
    <main id="page-root"></main>
  </div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
