# Source-quality tiers for the deterministic FACT guard (app/sources.py, app/manager.py).
#   1 = official, academic and statistics bodies
#   2 = app stores, review platforms, company pages and established publishers
#   3 = blogs, forums, social posts and any unknown site (lowest)
# A FACT whose cited URLs are all tier 3 is downgraded to INFERENCE with a note in its basis.
#
# Matching uses the URL's host only (a leading "www." is ignored; internationalized domains are listed
# in punycode). A listed domain covers its subdomains and the longest listed match wins; a host whose
# first label is in `blog_labels` is tier 3 unless that exact host is listed. A company's own site
# counts as tier 2 only once its domain is listed here. Official country suffixes are listed one by one
# (not "any gov./ac./go. label"), because in some country domains those are ordinary registrable names
# (go.to is a redirect service). Edits take effect on restart.

default_tier: 3
blog_labels: [blog, blogs]
official_tlds: [gov, edu, mil, int]  # restricted TLDs: census.gov, mit.edu, who.int

tiers:
  1:
    # official country suffixes (government / academic)
    - gov.ir
    - ac.ir
    - gov.uk
    - ac.uk
    - gc.ca
    - gov.au
    - edu.au
    - govt.nz
    - ac.nz
    - go.jp
    - ac.jp
    - go.kr
    - ac.kr
    - gov.in
    - ac.in
    - gov.cn
    - edu.cn
    - gov.sg
    - edu.sg
